name: Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: "Version bump: patch, minor, major, or explicit (e.g. 1.27.0)"
        required: true
        default: "patch"
        type: string
      release_name:
        description: 'Custom release name (optional, defaults to "CloudCLI UI vX.Y.Z")'
        required: false
        type: string

permissions:
  contents: read

# This workflow publishes releases with write credentials, so actions are pinned
# to immutable commit SHAs. The trailing comments keep the original major tag
# visible for maintenance context.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: git config
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Require release credentials before mutation
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for secret_name in \
            NPM_TOKEN \
            MACOS_CSC_LINK \
            MACOS_CSC_KEY_PASSWORD \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID \
            WINDOWS_CSC_LINK \
            WINDOWS_CSC_KEY_PASSWORD
          do
            if [ -z "${!secret_name}" ]; then
              echo "Missing required Actions secret: $secret_name" >&2
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Require successful CI for release commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release/require-ci-success.mjs wait \
            --repository "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --expected-sha "$GITHUB_SHA" \
            --event push \
            --timeout-seconds 30 \
            --poll-seconds 5 \
            --max-pages 10

      - name: Install locked dependencies
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_INCREMENT: ${{ inputs.increment }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_INCREMENT" =~ ^(patch|minor|major|[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Invalid release increment: $RELEASE_INCREMENT" >&2
            exit 1
          fi
          ARGS=(--ci "--increment=$RELEASE_INCREMENT")
          if [ -n "$RELEASE_NAME" ]; then
            ARGS+=("--github.releaseName=$RELEASE_NAME")
          fi
          npx release-it "${ARGS[@]}"
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          FINAL_SHA="$(git rev-parse "$TAG^{commit}")"
          {
            echo "tag=$TAG"
            echo "sha=$FINAL_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Verify remote release identity
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          FINAL_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin \
            "refs/heads/main:refs/remotes/origin/main"
          git fetch --no-tags --force origin \
            "refs/tags/$RELEASE_TAG:refs/release-gates/tags/$RELEASE_TAG"
          test "$(git rev-parse "refs/release-gates/tags/$RELEASE_TAG^{commit}")" = "$FINAL_SHA"
          git merge-base --is-ancestor "$FINAL_SHA" refs/remotes/origin/main

      - name: Require successful CI for final release commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          FINAL_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          GATE_ID="release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${FINAL_SHA:0:12}"
          node scripts/release/require-ci-success.mjs dispatch-and-wait \
            --repository "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --ref "$RELEASE_TAG" \
            --expected-sha "$FINAL_SHA" \
            --gate-id "$GATE_ID" \
            --timeout-seconds 3600 \
            --poll-seconds 15 \
            --max-pages 10

      - name: Start native desktop builds
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          FINAL_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin \
            "refs/heads/main:refs/remotes/origin/main"
          git fetch --no-tags --force origin \
            "refs/tags/$RELEASE_TAG:refs/release-gates/final/$RELEASE_TAG"
          test "$(git rev-parse "refs/release-gates/final/$RELEASE_TAG^{commit}")" = "$FINAL_SHA"
          git merge-base --is-ancestor "$FINAL_SHA" refs/remotes/origin/main
          gh workflow run desktop-release.yml \
            --ref "$RELEASE_TAG" \
            -f "tag=$RELEASE_TAG" \
            -f "expected_sha=$FINAL_SHA" \
            -f "release_mode=production"
