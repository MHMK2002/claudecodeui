name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing stable tag to build (for example v1.38.0)"
        required: true
        type: string
      expected_sha:
        description: "Exact commit SHA that the tag and every build must use"
        required: true
        type: string
      release_mode:
        description: "Signing policy: production credentials or repository-managed internal certificates"
        required: true
        default: production
        type: choice
        options:
          - production
          - internal

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve immutable release identity
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      build_id: ${{ steps.release.outputs.build_id }}
      release_date: ${{ steps.release.outputs.release_date }}
      release_mode: ${{ steps.release.outputs.release_mode }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag, version, and commit
        id: release
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_EXPECTED_SHA: ${{ inputs.expected_sha }}
          DISPATCH_RELEASE_MODE: ${{ inputs.release_mode }}
          DEFAULT_RELEASE_MODE: ${{ vars.DESKTOP_RELEASE_MODE }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${DISPATCH_TAG:-$REF_TAG}"
          RELEASE_MODE="${DISPATCH_RELEASE_MODE:-${DEFAULT_RELEASE_MODE:-production}}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Desktop releases require a stable vMAJOR.MINOR.PATCH tag." >&2
            exit 1
          fi
          if [[ "$RELEASE_MODE" != "production" && "$RELEASE_MODE" != "internal" ]]; then
            echo "Desktop release mode must be production or internal." >&2
            exit 1
          fi
          if [ -n "$DISPATCH_EXPECTED_SHA" ]; then
            PINNED_SHA="$DISPATCH_EXPECTED_SHA"
          else
            PINNED_SHA="$(git rev-parse "$GITHUB_SHA^{commit}")"
          fi
          if [[ ! "$PINNED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Desktop releases require a full expected commit SHA." >&2
            exit 1
          fi
          git fetch --no-tags --force origin \
            "refs/heads/main:refs/remotes/origin/main"
          git fetch --no-tags --force origin \
            "refs/tags/$TAG:refs/release-gates/desktop/$TAG"
          SHA="$(git rev-parse "refs/release-gates/desktop/$TAG^{commit}")"
          if [ "$SHA" != "$PINNED_SHA" ]; then
            echo "Tag $TAG does not resolve to the pinned release commit." >&2
            exit 1
          fi
          git merge-base --is-ancestor "$SHA" refs/remotes/origin/main
          VERSION="$(git show "$SHA:package.json" | node -e "let body=''; process.stdin.on('data', c => body += c); process.stdin.on('end', () => process.stdout.write(JSON.parse(body).version));")"
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "Tag $TAG does not match package version $VERSION." >&2
            exit 1
          fi
          RELEASE_DATE="$(git show -s --format=%cI "$SHA")"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "sha=$SHA"
            echo "build_id=$VERSION-$SHA"
            echo "release_date=$RELEASE_DATE"
            echo "release_mode=$RELEASE_MODE"
          } >> "$GITHUB_OUTPUT"

      - name: Require successful CI for pinned release commit
        shell: bash
        env:
          PINNED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          node scripts/release/require-ci-success.mjs wait \
            --repository "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --expected-sha "$PINNED_SHA" \
            --event push \
            --event workflow_dispatch \
            --timeout-seconds 3600 \
            --poll-seconds 15 \
            --max-pages 10

      - name: Revalidate release identity immediately before native builds
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          PINNED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin \
            "refs/heads/main:refs/remotes/origin/main"
          git fetch --no-tags --force origin \
            "refs/tags/$TAG:refs/release-gates/desktop-final/$TAG"
          test "$(git rev-parse "refs/release-gates/desktop-final/$TAG^{commit}")" = "$PINNED_SHA"
          git merge-base --is-ancestor "$PINNED_SHA" refs/remotes/origin/main

  build:
    name: Build ${{ matrix.label }}
    needs: resolve
    strategy:
      fail-fast: true
      matrix:
        include:
          - id: macos-x64
            label: macOS Intel
            runner: macos-15-intel
            script: mac
            bundle_platform: mac
            arch: x64
            metadata: latest-mac.yml
            signing: mac
          - id: macos-arm64
            label: macOS Apple Silicon
            runner: macos-15
            script: mac
            bundle_platform: mac
            arch: arm64
            metadata: latest-mac.yml
            signing: mac
          - id: windows-x64
            label: Windows x64
            runner: windows-2025
            script: win
            bundle_platform: win
            arch: x64
            metadata: latest.yml
            signing: windows
          - id: linux-x64
            label: Linux x64
            runner: ubuntu-24.04
            script: linux
            bundle_platform: linux
            arch: x64
            metadata: latest-linux.yml
            signing: none
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.22.3
          cache: npm

      - name: Verify native runner architecture
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e "if (process.arch !== process.env.EXPECTED_ARCH) throw new Error('Expected ' + process.env.EXPECTED_ARCH + ' runner, got ' + process.arch)"

      - name: Install locked dependencies
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Require macOS signing credentials
        if: matrix.signing == 'mac'
        shell: bash
        env:
          RELEASE_MODE: ${{ needs.resolve.outputs.release_mode }}
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          if [ "$RELEASE_MODE" = "production" ]; then
            test -n "$APPLE_ID"
            test -n "$APPLE_APP_SPECIFIC_PASSWORD"
            test -n "$APPLE_TEAM_ID"
          fi

      - name: Require Windows signing credentials
        if: matrix.signing == 'windows'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"

      - name: Trust internal macOS signing certificate
        if: matrix.signing == 'mac' && needs.resolve.outputs.release_mode == 'internal'
        shell: bash
        env:
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          P12_PATH="$RUNNER_TEMP/cloudcli-internal-macos.p12"
          CERT_PATH="$RUNNER_TEMP/cloudcli-internal-macos.pem"
          node -e 'require("node:fs").writeFileSync(process.argv[1], Buffer.from(process.env.MACOS_CSC_LINK, "base64"))' "$P12_PATH"
          openssl pkcs12 -in "$P12_PATH" -clcerts -nokeys -passin env:MACOS_CSC_KEY_PASSWORD -out "$CERT_PATH"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$CERT_PATH"
          rm -f "$P12_PATH" "$CERT_PATH"

      - name: Trust internal Windows signing certificate
        if: matrix.signing == 'windows' && needs.resolve.outputs.release_mode == 'internal'
        shell: pwsh
        env:
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $pfxPath = Join-Path $env:RUNNER_TEMP 'cloudcli-internal-windows.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CSC_LINK))
          $certificate = $null
          try {
            Write-Host 'Extracting internal Windows public certificate.'
            $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $pfxPath,
              $env:WINDOWS_CSC_KEY_PASSWORD,
              [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
            )
            if (-not $certificate.HasPrivateKey) {
              throw 'Internal Windows signing certificate has no private key.'
            }

            $storeNames = @(
              [System.Security.Cryptography.X509Certificates.StoreName]::Root,
              [System.Security.Cryptography.X509Certificates.StoreName]::TrustedPublisher
            )
            foreach ($storeName in $storeNames) {
              Write-Host "Trusting internal Windows certificate in $storeName."
              $store = [System.Security.Cryptography.X509Certificates.X509Store]::new(
                $storeName,
                [System.Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser
              )
              try {
                $store.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
                $store.Add($certificate)
                $matches = $store.Certificates.Find(
                  [System.Security.Cryptography.X509Certificates.X509FindType]::FindByThumbprint,
                  $certificate.Thumbprint,
                  $false
                )
                if ($matches.Count -eq 0) {
                  throw "Failed to trust the internal Windows certificate in $storeName."
                }
              } finally {
                if ($null -ne $store) { $store.Dispose() }
              }
            }
          } finally {
            if ($null -ne $certificate) { $certificate.Dispose() }
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Build signed desktop distribution
        shell: bash
        env:
          CLOUDCLI_BUILD_ID: ${{ needs.resolve.outputs.build_id }}
          CLOUDCLI_BUNDLE_PLATFORM: ${{ matrix.bundle_platform }}
          CLOUDCLI_BUNDLE_ARCH: ${{ matrix.arch }}
          CLOUDCLI_RELEASE_MODE: ${{ needs.resolve.outputs.release_mode }}
          CSC_LINK: ${{ matrix.signing == 'mac' && secrets.MACOS_CSC_LINK || matrix.signing == 'windows' && secrets.WINDOWS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.signing == 'mac' && secrets.MACOS_CSC_KEY_PASSWORD || matrix.signing == 'windows' && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.signing == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.signing == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.signing == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.signing == 'none' && 'false' || 'true' }}
        run: npm run "desktop:dist:${{ matrix.script }}" -- --${{ matrix.arch }} --publish never

      - name: Verify macOS signature
        if: matrix.signing == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find release/desktop -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Verify macOS notarization ticket
        if: matrix.signing == 'mac' && needs.resolve.outputs.release_mode == 'production'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' artifact; do
            xcrun stapler validate "$artifact"
          done < <(find release/desktop -maxdepth 1 -type f -name '*.dmg' -print0)

      - name: Verify Windows Authenticode signature
        if: matrix.signing == 'windows'
        shell: pwsh
        run: |
          $installers = Get-ChildItem release/desktop/*.exe
          if ($installers.Count -eq 0) { throw "No Windows installer was produced." }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $($installer.Name): $($signature.Status)"
            }
          }

      - name: Smoke-test Linux AppImage
        if: matrix.signing == 'none'
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE="$(find release/desktop -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract >/dev/null
          test -f squashfs-root/AppRun
          rm -rf squashfs-root

      - name: Stage immutable release artifacts
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          BUNDLE_PLATFORM: ${{ matrix.bundle_platform }}
          ARCH: ${{ matrix.arch }}
          METADATA_NAME: ${{ matrix.metadata }}
        run: |
          set -euo pipefail
          mkdir -p release-upload metadata-upload
          while IFS= read -r -d '' artifact; do
            cp "$artifact" release-upload/
          done < <(find release/desktop -maxdepth 1 -type f -name "*${VERSION}*" -print0)
          cp "release/desktop/$METADATA_NAME" metadata-upload/
          BUNDLE="cloudcli-local-server-${VERSION}-${BUNDLE_PLATFORM}-${ARCH}.tar.gz"
          cp "release/local-server/$BUNDLE" "release/local-server/$BUNDLE.sha256" release-upload/
          test -n "$(find release-upload -maxdepth 1 -type f -print -quit)"
          test -f "metadata-upload/$METADATA_NAME"

      - name: Upload versioned build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-assets-${{ matrix.id }}
          path: release-upload/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload updater metadata fragment
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: updater-metadata-${{ matrix.id }}
          path: metadata-upload/*
          if-no-files-found: error
          retention-days: 14

  merge-metadata:
    name: Merge and validate updater metadata
    needs:
      - resolve
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install metadata tooling
        run: npm ci --ignore-scripts

      - name: Download updater metadata fragments
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: updater-metadata-*
          path: metadata-fragments

      - name: Merge platform metadata
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_DATE: ${{ needs.resolve.outputs.release_date }}
        run: |
          set -euo pipefail
          mkdir -p updater-metadata
          mapfile -t MAC_METADATA < <(find metadata-fragments -type f -name latest-mac.yml | sort)
          mapfile -t WIN_METADATA < <(find metadata-fragments -type f -name latest.yml | sort)
          mapfile -t LINUX_METADATA < <(find metadata-fragments -type f -name latest-linux.yml | sort)
          test "${#MAC_METADATA[@]}" -eq 2
          test "${#WIN_METADATA[@]}" -eq 1
          test "${#LINUX_METADATA[@]}" -eq 1
          node scripts/release/merge-update-metadata.mjs --output updater-metadata/latest-mac.yml --version "$VERSION" --release-date "$RELEASE_DATE" "${MAC_METADATA[@]}"
          node scripts/release/merge-update-metadata.mjs --output updater-metadata/latest.yml --version "$VERSION" --release-date "$RELEASE_DATE" "${WIN_METADATA[@]}"
          node scripts/release/merge-update-metadata.mjs --output updater-metadata/latest-linux.yml --version "$VERSION" --release-date "$RELEASE_DATE" "${LINUX_METADATA[@]}"

      - name: Upload final updater metadata
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: updater-metadata-merged
          path: updater-metadata/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Atomically publish desktop release
    needs:
      - resolve
      - build
      - merge-metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout release tooling and tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install release verification tooling
        run: npm ci --ignore-scripts

      - name: Download versioned release artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Download final updater metadata
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: updater-metadata-merged
          path: updater-metadata

      - name: Add internal trust certificates and installation guide
        if: needs.resolve.outputs.release_mode == 'internal'
        shell: bash
        env:
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MACOS_CSC_LINK"
          test -n "$MACOS_CSC_KEY_PASSWORD"
          test -n "$WINDOWS_CSC_LINK"
          test -n "$WINDOWS_CSC_KEY_PASSWORD"
          printf '%s' "$MACOS_CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cloudcli-internal-macos.p12"
          printf '%s' "$WINDOWS_CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cloudcli-internal-windows.pfx"
          openssl pkcs12 -legacy -in "$RUNNER_TEMP/cloudcli-internal-macos.p12" -clcerts -nokeys -passin env:MACOS_CSC_KEY_PASSWORD -out "$RUNNER_TEMP/cloudcli-internal-macos.pem"
          openssl pkcs12 -legacy -in "$RUNNER_TEMP/cloudcli-internal-windows.pfx" -clcerts -nokeys -passin env:WINDOWS_CSC_KEY_PASSWORD -out "$RUNNER_TEMP/cloudcli-internal-windows.pem"
          openssl x509 -in "$RUNNER_TEMP/cloudcli-internal-macos.pem" -outform der -out release-assets/cloudcli-internal-macos.cer
          openssl x509 -in "$RUNNER_TEMP/cloudcli-internal-windows.pem" -outform der -out release-assets/cloudcli-internal-windows.cer
          cp docs/INTERNAL_DESKTOP_INSTALL.md release-assets/
          rm -f "$RUNNER_TEMP"/cloudcli-internal-*.p12 "$RUNNER_TEMP"/cloudcli-internal-*.pfx "$RUNNER_TEMP"/cloudcli-internal-*.pem

      - name: Verify updater hashes and release completeness
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/release/verify-update-release.mjs release-assets updater-metadata "$VERSION"
          (
            cd release-assets
            sha256sum -- * | sort -k2 > "SHASUMS256-${TAG}.txt"
          )

      - name: Require an unpublished draft and immutable asset names
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_MODE: ${{ needs.resolve.outputs.release_mode }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-list -n 1 "$TAG")" = "$SHA"
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" || {
              echo "Release $TAG is already published; refusing to mutate it." >&2
              exit 1
            }
          else
            if [ "$RELEASE_MODE" = "internal" ]; then
              gh release create "$TAG" --verify-tag --draft --title "CloudCLI v${TAG#v} (Internal Self-Signed)" --notes-file docs/INTERNAL_DESKTOP_INSTALL.md
            else
              gh release create "$TAG" --verify-tag --draft --title "CloudCLI v${TAG#v}"
            fi
          fi

          mapfile -t EXISTING_ASSETS < <(gh release view "$TAG" --json assets --jq '.assets[].name')
          while IFS= read -r -d '' artifact; do
            name="$(basename "$artifact")"
            for existing in "${EXISTING_ASSETS[@]}"; do
              if [[ "$name" = "$existing" ]]; then
                echo "Release asset $name already exists; refusing to overwrite it." >&2
                exit 1
              fi
            done
          done < <(find release-assets updater-metadata -maxdepth 1 -type f -print0)

      - name: Upload immutable versioned artifacts
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -d '' ASSETS < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          gh release upload "$TAG" "${ASSETS[@]}"

      - name: Upload updater metadata last
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -d '' METADATA < <(find updater-metadata -maxdepth 1 -type f -print0 | sort -z)
          gh release upload "$TAG" "${METADATA[@]}"

      - name: Publish the complete release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest --verify-tag
